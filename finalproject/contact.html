<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description"
            content="Contact the Nigerian States Explorer team. Send feedback, suggestions or questions.">
        <meta name="author" content="Mathew Udowa Oghenemairo">

        <meta property="og:title" content="Contact | Nigerian States Explorer">
        <meta property="og:description" content="Send us your feedback or questions about Nigerian states.">
        <meta property="og:type" content="website">

        <title>Contact | Nigerian States Explorer</title>



        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap"
            rel="stylesheet">
        <link rel="icon" href="images/favicon.ico">
        <link rel="stylesheet" href="styles/normalize.css">
        <link rel="stylesheet" href="styles/small.css">
        <link rel="stylesheet" href="styles/medium.css">
        <link rel="stylesheet" href="styles/large.css">
        <script type="module" src="scripts/contact.js"></script>
    </head>

    <body>
        <div class="header-wrapper">
        
            <header>
                <img src="images/logoipsum-247.webp" alt="Nigerian States Explorer Logo" width="42" height="42">
                <span>Nigerian States Explorer</span>
                <button id="hamburger-button" class="hamburger" aria-label="Toggle navigation menu"></button>
            </header>
        
            <nav id="navigation-button" class="navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="states.html">States Directory</a></li>
                    <li class="current"><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>

        <!-- This is the main section -->
        <main class="contact-main">
            <h1 class="page-title">Contact Us</h1>
            <p class="page-intro">
                Have a suggestion, correction, or question about any Nigerian state?
                Fill the form below and we will get back to you.
            </p>

            <!-- This is the form section -->
            <form method="GET" action="thankyou.html" class="contact-form">

                <label>
                    <span class="label-text">Full Name <span class="required-field">*</span></span>
                    <input type="text" name="fullname" required autocomplete="name" placeholder="Example: Chinedu Okeke"
                        title="Please enter your full name">
                </label>

                <label>
                    <span class="label-text">Email Address <span class="required-field">*</span></span>
                    <input type="email" name="email" required autocomplete="email" placeholder="example@gmail.com"
                        title="Please enter a valid email">
                </label>

                <label>
                    <span class="label-text">Phone Number <span class="optional field">(optional)</span></span>
                    <input type="tel" name="phone" autocomplete="tel" placeholder="0803-123-4567"
                        title="Optional phone number">
                </label>

                <label>
                    <span class="label-text">Reason for Contact <span class="required-field">*</span></span>
                    <select name="reason" required>
                        <option value="">-- Select a reason --</option>
                        <option value="Suggestion">Suggestion</option>
                        <option value="Correction">Correction / Update</option>
                        <option value="Question">General Question</option>
                        <option value="Other">Other</option>
                    </select>
                </label>

                <label>
                    <span class="label-text">Your Message <span class="required-field">*</span></span>
                    <textarea name="message" required rows="5" placeholder="Type your message here..."
                        title="Please write your message"></textarea>
                </label>

                <button type="submit" class="action-button action-button-primary submit-button">Send Message</button>
            </form>
        </main>

        <!-- This is the footer -->
        <footer class="site-footer">
            <div class="footer-content">
                <p>&copy; <span id="current-year"></span> Nigerian States Explorer</p>
                <p>
                    <a href="attributions.html">Attributions</a> |
                    <a href="#">Terms and Conditions</a>
                </p>
                <p id="last-modified"></p>
                <a href="https://www.loom.com/share/1add3dad7e2a4589b7e3d63fd5d7c597">Video demonstration/Reflection</a>
            </div>
        </footer>
    </body>

</html>
