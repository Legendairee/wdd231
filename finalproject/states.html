<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description"
            content="Browse and filter all states of Nigeria by geopolitical zone. View capitals, population and interesting facts.">
        <meta name="author" content="Mathew Udowa Oghenemairo">

        <meta property="og:title" content="States Directory | Nigerian States Explorer">
        <meta property="og:description" content="Search and filter all Nigerian states by geopolitical zone.">
        <meta property="og:type" content="website">

        <title>States Directory | Nigerian States Explorer</title>



        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap"
            rel="stylesheet">

        <link rel="icon" href="images/favicon.ico">
        <link rel="stylesheet" href="styles/normalize.css">
        <link rel="stylesheet" href="styles/small.css">
        <link rel="stylesheet" href="styles/medium.css">
        <link rel="stylesheet" href="styles/large.css">
        <script type="module" src="scripts/states.js"></script>
    </head>

    <body>
        <div class="header-wrapper">
            <!-- This is the header Section -->
            <header>
                <img src="images/logoipsum-247.webp" alt="Nigerian States Explorer Logo" width="42" height="42">
                <span>Nigerian States Explorer</span>
                <button id="hamburger-button" class="hamburger" aria-label="Toggle navigation menu"></button>
            </header>
            <!-- The navigation section -->
            <nav id="navigation-button" class="navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li class="current"><a href="states.html">States Directory</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>

        <!-- This is my main section -->
        <main class="directory-main">
            <h1 class="page-title">States Directory</h1>
            <p class="page-intro">Search or filter the states by geopolitical zone.</p>

            <div class="controls">
                <input type="search" id="search-input" class="search-input" placeholder="Search by state name..."
                    aria-label="Search states">

                <select id="zone-filter" class="zone-filter" aria-label="Filter by zone">
                    <option value="all">All Zones</option>
                    <option value="North Central">North Central</option>
                    <option value="North East">North East</option>
                    <option value="North West">North West</option>
                    <option value="South East">South East</option>
                    <option value="South South">South South</option>
                    <option value="South West">South West</option>
                </select>
            </div>

            <p class="favourites-info">
                You have <span id="favourites-count">0</span> favourite state(s).
                <button id="clear-favourites" class="clear-button">Clear Favourites</button>
            </p>

            <div id="states-container" class="states-container">
                <p class="is-loading">Loading states...</p>
            </div>
        </main>

        <!-- The modal section -->
        <div id="state-modal" class="dialog-overlay" hidden>
            <div class="dialog-box">
                <button class="dialog-close-btn" id="dialog-close-btn" aria-label="Close modal">&times;</button>
                <div id="dialog-body">

                </div>
            </div>
        </div>

        <!-- This is the footer -->
        <footer class="site-footer">
            <div class="footer-content">
                <p>&copy; <span id="current-year"></span> Nigerian States Explorer</p>
                <p>
                    <a href="attributions.html">Attributions</a> |
                    <a href="#">Terms and Conditions</a>
                </p>
                <p id="last-modified"></p>
            </div>
        </footer>
    </body>

</html>
