<!DOCTYPE html>
<html lang="en">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description"
            content="Explore the official member directory of the Eko Chamber of Commerce. An independent, private business network connecting enterprises within Lagos.">
        <meta name="keywords"
            content="Eko Chamber of Commerce, Lagos Businesses, Independent Business Association, Private Sector Nigeria, West Africa Trade">
        <meta name="author" content="Eko Chamber of Commerce">
        <meta property="og:title" content="Eko Chamber of Commerce | Business Directory">
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://www.ekochamber.ng/directory.html">
        <meta property="og:image" content="https://legendairee.github.io/wdd231/chamber/images/facebook-tag.jpg">
        <meta property="og:description"
            content="Connect with trusted private enterprises, commercial leaders, and innovative startups through the Eko Chamber of Commerce directory.">
        <meta property="og:site_name" content="Eko Chamber of Commerce">
        <title>Eko Chamber of Commerce | Member Directory</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..600;1,100..600&display=swap"
            media="print" onload="this.media='all'">
        <noscript>
            <link rel="stylesheet"
                href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..600;1,100..600&display=swap">
        </noscript>

        <link rel="preload" as="image" href="./images/logoipsum-339.webp" fetchpriority="high">
        <link rel="icon" href="./images/head-image.ico">

        <link rel="stylesheet" href="./styles/normalize.css">
        <link rel="stylesheet" href="./styles/styles.css">
        <link rel="stylesheet" href="./styles/large.css">

        <script src="scripts/directory.js" defer></script>
    </head>

    <body>

         <!-- The header section -->
        <header>
            <img src="./images/logoipsum-339.webp" alt="Eko Chamber Logo" width="60" height="60" fetchpriority="high"
                decoding="async">
            <span>Eko Chamber of Commerce</span>
            <button id="mode-btn" class="mode-toggle" aria-label="Toggle Dark Mode">◐</button>
            <button id="ham-btn" class="hamburger" aria-label="Toggle navigation menu"></button>
        </header>

        <!-- This is the navigation -->
        <nav id="nav-bar" class="navigation">
            <ul>
                <li><a href="#">Home</a></li>
                <li class="active"><a href="#">Directory</a></li>
                <li><a href="#">Join</a></li>
                <li><a href="#">Discover</a></li>
            </ul>
        </nav>

        <!-- This is my main section -->
        <main>
            <div class="directory-header">
                <h1>Directory</h1>
                <div class="view-buttons">
                    <button id="grid-view" class="active-btn" aria-label="Grid View">Grid</button>
                    <button id="list-view" aria-label="List View">List</button>
                </div>
            </div>

            <ul id="members-container" class="grid-layout"></ul>
        </main>

        <!-- This is the footer -->
        <footer>
            <div class="footer-container">
                <div class="footer-left">
                    <p><strong>Eko Chamber of Commerce</strong></p>
                    <p>15 Mobolaji Bank Anthony Way</p>
                    <p>Ikeja, Lagos State, Nigeria</p>
                    <p>info@ekochamber.ng</p>
                    <p>+234 801 492 1000</p>
                </div>
                <div class="footer-center">
                    <div class="social-icons">
                        <a href="https://facebook.com/profile.php?id=100001974445466" target="_blank" rel="noopener"
                            aria-label="Facebook Profile">
                            <img src="./images/facebook.svg" alt="Facebook logo" width="44" height="44" loading="lazy">
                        </a>
                        <a href="https://github.com/Legendairee" target="_blank" rel="noopener"
                            aria-label="GitHub Profile">
                            <img src="./images/github.svg" alt="GitHub logo" width="44" height="44" loading="lazy">
                        </a>
                        <a href="https://www.linkedin.com/in/mathew-udowa-0b61343a7/" target="_blank" rel="noopener"
                            aria-label="LinkedIn Profile">
                            <img src="./images/linkedin.svg" alt="LinkedIn logo" width="44" height="44" loading="lazy">
                        </a>
                        <a href="https://x.com/DayWalkercrypt" target="_blank" rel="noopener" aria-label="X Profile">
                            <img src="./images/twitter-x.svg" alt="X logo" width="44" height="44" loading="lazy">
                        </a>
                    </div>
                </div>
                <div class="footer-right">
                    <p><strong>WDD231 Class Project</strong></p>
                    <p>Mathew Udowa</p>
                    <p>© <span id="year"></span> Eko Chamber of Commerce</p>
                    <p id="lastModified"></p>
                </div>
            </div>
        </footer>
    </body>

</html>
